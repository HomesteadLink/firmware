# AP fallback (§F5): hostapd on wlan0, used only in AP/provisioning mode.
# SSID HomesteadLink-<serial last4> and the passphrase are substituted
# by hsl-firstboot (sed on the live copy in /etc/hostapd/), never
# committed with real values here. The passphrase is an independent
# high-entropy per-device secret (identity.json ap_passphrase,
# /dev/urandom) — NOT derived from the setup code or serial (R3-3).
interface=wlan0
driver=nl80211
ssid=HomesteadLink-XXXX
hw_mode=g
channel=6
wpa=2
wpa_passphrase=AP_PASSPHRASE_FROM_IDENTITY
wpa_key_mgmt=WPA-PSK
rsn_pairwise=CCMP
