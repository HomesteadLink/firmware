# AP fallback (§F5): hostapd on wlan0, used only in AP/provisioning mode.
# SSID HomesteadLink-<serial last4> and the passphrase are substituted
# by hsl-firstboot (sed on the live copy in /etc/hostapd/), never
# committed with real values here. The passphrase is the §F1 :ap
# derivation — first 5 bytes of HMAC-SHA256(key = device-secret,
# message = serial + ":ap") mod 10^12, 12 digits: independent of
# the setup code (a different HMAC domain), with the device-secret
# as its only SECRET input (Decision Log 33).
interface=wlan0
driver=nl80211
ssid=HomesteadLink-XXXX
hw_mode=g
channel=6
wpa=2
wpa_passphrase=AP_PASSPHRASE_FROM_IDENTITY
wpa_key_mgmt=WPA-PSK
rsn_pairwise=CCMP
