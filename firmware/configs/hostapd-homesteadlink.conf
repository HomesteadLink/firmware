# AP fallback (§F5): hostapd on wlan0, used only in AP/provisioning mode.
# SSID HomesteadLink-<serial last4> and password <setup code><serial last4>
# are substituted by the board setup at first boot (sed on the live copy
# in /etc/hostapd/), never committed with real values here.
interface=wlan0
driver=nl80211
ssid=HomesteadLink-XXXX
hw_mode=g
channel=6
wpa=2
wpa_passphrase=SETUPCODE_LAST4
wpa_key_mgmt=WPA-PSK
rsn_pairwise=CCMP
