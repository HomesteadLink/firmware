# HomeSteadyLink BlueZ snippet (§F2) — installed as /etc/bluetooth/main.conf
# (merged over the stock file by build-image.sh if one already exists).
[General]
Name = HomeSteadyLink
ControllerMode = le
Privacy = off
# Trim unused plugins at runtime equivalent: bluetooth.service is started
# by the stock unit; unsupported plugins are disabled here where BlueZ
# honours it, the rest are simply never advertised by hsl-provisiond.
DiscoverableTimeout = 0
PairableTimeout = 0

[Policy]
AutoEnable = true
