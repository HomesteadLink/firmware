# HomeSteadyLink BlueZ main.conf (§F2) — installed as /etc/bluetooth/main.conf.
# No Name= here: the adapter alias HSL-<serial last4> is set by hsl-provisiond.
[General]
ControllerMode = le
Privacy = off
# Timeouts are 0 (never expire) — firmware#13: BlueZ clears
# Pairable/Discoverable at 300 s on its own while the provisioning
# window manager keeps the window open permanently, so after 5 min
# uptime a new owner could not pair even with the window open.
DiscoverableTimeout = 0
PairableTimeout = 0

[Policy]
AutoEnable = true
