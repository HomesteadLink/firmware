#!/usr/sbin/nft -f
# HomeSteadyLink kill switch (§F4): ONE merged ruleset, installed as
# /etc/nftables.conf and loaded by nftables.service at boot, before any
# VPN starts. Never removed. hsl-provisiond edits ONLY the portal_pass
# chain at runtime.
flush ruleset

table inet hsl_filter {
	chain forward {
		type filter hook forward priority 0; policy drop;
		ct state established,related accept
		jump portal_pass
		iifname "usb0" oifname { "wg-hsl", "tailscale0", "tun0" } accept
		iifname "wlan0" oifname { "wg-hsl", "tailscale0", "tun0" } accept
	}
	# Captive-portal exception: destination-scoped accepts are inserted
	# by hsl-provisiond for exactly 10 min (Control portal_pass, §F4).
	chain portal_pass {
	}
	chain input {
		type filter hook input priority 0; policy accept;
	}
}

table ip hsl_nat {
	chain postrouting {
		type nat hook postrouting priority 100; policy accept;
		ip saddr 192.168.64.0/24 oifname { "wg-hsl", "tailscale0", "tun0" } masquerade
		ip saddr 192.168.65.0/24 oifname { "wg-hsl", "tailscale0", "tun0" } masquerade
	}
}
