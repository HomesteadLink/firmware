#!/usr/sbin/nft -f
# HomeSteadyLink merged ruleset (§F4) — installed by the build at
# /etc/nftables.conf and loaded by nftables.service at boot before
# any VPN starts; never removed. provisiond loads NO table of its
# own — its only nft action is editing the portal_pass chain.
# Kill switch: forwarded client traffic may leave ONLY via a VPN
# interface (wg-hsl / tailscale0). No VPN = no client egress.
flush ruleset

table inet hsl_filter {
	chain input {
		type filter hook input priority 0; policy drop;
		iif "lo" accept
		ct state established,related accept
		# From usb0 (and wlan0 in AP mode): DHCP, DNS (dnsmasq),
		# the config page — everything else is dropped, including
		# all other input from wlan0 in STA mode.
		iifname "usb0" udp dport 67 accept
		iifname "usb0" udp dport 53 accept
		iifname "usb0" tcp dport 53 accept
		iifname "usb0" tcp dport 8080 accept
		iifname "wlan0" udp dport 67 accept
		iifname "wlan0" udp dport 53 accept
		iifname "wlan0" tcp dport 53 accept
		iifname "wlan0" tcp dport 8080 accept
	}

	chain forward {
		type filter hook forward priority 0; policy drop;
		ct state established,related accept
		jump portal_pass
		iifname "usb0" oifname { "wg-hsl", "tailscale0" } accept
		iifname "wlan0" oifname { "wg-hsl", "tailscale0" } accept
	}

	# Empty by default; the captive-portal pass is its only writer
	# (provisiond adds destination-scoped accepts for 10 min).
	chain portal_pass {
	}

	# Device-originated traffic is unrestricted in v1: it must
	# flow before any VPN exists. Client traffic never takes this
	# path — it enters on forward.
	chain output {
		type filter hook output priority 0; policy accept;
	}
}

table ip hsl_nat {
	chain postrouting {
		type nat hook postrouting priority 100; policy accept;
		ip saddr 192.168.64.0/24 oifname { "wg-hsl", "tailscale0" } masquerade
	}
}
