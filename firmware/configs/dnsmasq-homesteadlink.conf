# HomeSteadyLink dnsmasq snippet (§F5) — drop-in for the usb0 gadget LAN.
# DNS is forwarded to the VPN resolver only: hsl-provisiond / the VPN-up
# hook rewrites the server= line to the resolver pushed by wg-hsl /
# tailscale; until the VPN is up there is deliberately no upstream here,
# so LAN clients get no DNS path around the kill switch.
interface=usb0
bind-interfaces
dhcp-range=172.30.0.10,172.30.0.100,255.255.255.0,12h
dhcp-option=option:router,172.30.0.1
# server=<vpn-resolver-ip>   # set at VPN-up time, e.g. server=10.64.0.1
no-resolv
