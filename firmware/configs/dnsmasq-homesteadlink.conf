# HomeSteadyLink dnsmasq config (§F5) — the ONLY dnsmasq config writer
# is the image build (§F4). Canonical subnet: usb0 192.168.64.1/24,
# DHCP 192.168.64.50-.150; AP mode adds wlan0 192.168.65.1/24,
# DHCP 192.168.65.10-.50 (second section below).
# No upstream server until a VPN is up: hsl-provisiond owns the
# server= line at runtime (WireGuard DNS= / Tailscale 100.100.100.100);
# on VPN down the line is removed — fail closed, never a direct leak.
interface=usb0
bind-interfaces
dhcp-range=192.168.64.50,192.168.64.150,255.255.255.0,12h
dhcp-option=option:router,192.168.64.1
no-resolv
# --- AP-mode section (active only while hostapd AP mode runs) ---
# interface=wlan0
# dhcp-range=192.168.65.10,192.168.65.50,255.255.255.0,12h
# dhcp-option=option:router,192.168.65.1
